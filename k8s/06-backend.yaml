# Backend: Spring Boot API, không giữ trạng thái (đăng nhập bằng JWT) nên chạy được nhiều bản.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: qlsv
  labels: {app: backend}
  annotations:
    kubernetes.io/change-cause: "backend v1"
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # luôn đủ số Pod đang phục vụ trong lúc cập nhật
  template:
    metadata:
      labels: {app: backend}
    spec:
      enableServiceLinks: false
      # Ép các Pod chia đều trên 2 worker (chênh lệch tối đa 1 Pod).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: backend}
          matchLabelKeys: ["pod-template-hash"]   # tính riêng theo từng phiên bản khi rolling update
          nodeTaintsPolicy: Honor                 # bỏ qua node đang hỏng, để Pod dồn được sang node còn lại
      # Mặc định Kubernetes chờ 300 giây mới dời Pod khỏi node chết; rút còn 30 giây cho dễ quan sát.
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: backend
          image: trung296/qlsv-backend:v1
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: {name: qlsv-config}
            - secretRef: {name: qlsv-secret}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          startupProbe:        # JVM khởi động chậm: cho tối đa 150 giây
            httpGet: {path: /health, port: 8082}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:      # chỉ nhận request khi /health báo UP (gồm cả kết nối MySQL)
            httpGet: {path: /health, port: 8082}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: 8082}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: qlsv
spec:
  type: ClusterIP        # chỉ gọi được từ trong cluster (frontend gọi sang)
  selector: {app: backend}
  ports:
    - port: 8082
      targetPort: 8082
