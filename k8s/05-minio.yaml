# MinIO (lưu file tài liệu sinh viên): thành phần có trạng thái, chạy 1 bản trên worker1 như MySQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: qlsv
  labels: {app: minio}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: worker1
      containers:
        - name: minio
          # Image của bên thứ ba: Chainguard chỉ phát hành miễn phí tag latest.
          # Image do nhóm build (frontend, backend) luôn gắn tag v1, v2.
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          securityContext:
            runAsUser: 0   # image mặc định chạy UID 65532, cần root để ghi vào hostPath
          ports:
            - containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: qlsv-secret, key: MINIO_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: qlsv-secret, key: MINIO_SECRET_KEY}}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/qlsv/minio
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: qlsv
spec:
  type: ClusterIP
  selector: {app: minio}
  ports:
    - port: 9000
      targetPort: 9000
