# MẪU. File thật là k8s/01-secret.yaml, tạo bằng: ./scripts/k8s/gen-secret.sh
# 01-secret.yaml chứa mật khẩu ngẫu nhiên và KHÔNG được commit (đã có trong .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: qlsv-secret
  namespace: qlsv
type: Opaque
stringData:
  DB_USER: qlsv_app
  DB_PASSWORD: change_me
  MYSQL_ROOT_PASSWORD: change_me_root
  AUTH_JWT_SECRET: change_me_base64_32_bytes
  MINIO_ACCESS_KEY: change_me
  MINIO_SECRET_KEY: change_me_min_8_chars
