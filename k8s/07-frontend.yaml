# Frontend: nginx phục vụ giao diện tĩnh và chuyển /api sang Service backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: qlsv
  labels: {app: frontend}
  annotations:
    kubernetes.io/change-cause: "frontend v1"
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: {app: frontend}
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: frontend}
          matchLabelKeys: ["pod-template-hash"]
          nodeTaintsPolicy: Honor
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: frontend
          image: trung296/qlsv-frontend:v1
          ports:
            - containerPort: 8080
          env:
            - name: API_HOST
              value: backend     # tên Service của backend
            - name: API_PORT
              value: "8082"
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: qlsv
spec:
  type: NodePort          # truy cập từ trình duyệt: http://<IP công khai của node bất kỳ>:30080
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
