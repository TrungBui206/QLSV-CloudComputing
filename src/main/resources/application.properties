
spring.application.name=QuanLySinhVienHibernateDao

server.port=${SERVER_PORT:8082}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:educaze_hibernate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh

spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Error response
server.error.include-message=always


# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:student-documents}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


app.jwt.secret=${AUTH_JWT_SECRET}
app.jwt.issuer=quanlysinhvien-hibernatedao
app.jwt.expiration-minutes=60

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}

# Actuator / Health check  ->  GET /health
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# GET /info: cho biet ban backend nao dang tra loi (dung khi chay nhieu replica tren Kubernetes)
management.info.env.enabled=true
info.service=backend
info.version=${APP_VERSION:dev}
info.pod=${POD_NAME:local}
info.node=${NODE_NAME:local}
