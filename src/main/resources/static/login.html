<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng nhập - Quản lý sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #e5e5e5;
            font-family: system-ui, sans-serif;
            color: #1f2937;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .brand h1 {
            margin: 0;
            font-size: 21px;
            color: #14397d;
        }

        .brand p {
            margin-top: 7px;
            font-size: 13px;
            color: #6b7280;
        }

        h2 {
            margin: 0 0 22px;
            font-size: 19px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
        }

        input:focus {
            outline: none;
            border-color: #14397d;
            box-shadow: 0 0 0 3px #e8eefb;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 72px;
        }

        .toggle-password {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            padding: 6px;
            border: none;
            background: transparent;
            color: #14397d;
            cursor: pointer;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #14397d;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #102e66;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <img src="images/logo.png"
             alt="Logo trường">

        <h1>QUẢN LÝ MÔN HỌC</h1>

        <p>HỆ THỐNG QUẢN TRỊ</p>
    </div>

    <h2>Đăng nhập hệ thống</h2>

    <div id="message"
         class="message"
         role="status"
         aria-live="polite"></div>

    <form id="loginForm">

        <label for="username">
            Tên đăng nhập

            <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Nhập tên đăng nhập"
                    autocomplete="username"
                    required>
        </label>

        <label for="password">
            Mật khẩu
        </label>

        <div class="password-box">

            <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required>

            <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword">
                Hiện
            </button>

        </div>

        <button
                type="submit"
                class="login-btn"
                id="loginBtn"
                style="margin-top: 18px">
            Đăng nhập
        </button>

    </form>

    <div class="footer">
        Hệ thống quản lý sinh viên
    </div>

</div>

<script>
    const LOGIN_API = '/api/auth/login';

    const AUTH_KEYS = {
        token: 'qlsv_access_token',
        type: 'qlsv_token_type',
        expiresAt: 'qlsv_expires_at'
    };

    const $ = id => document.getElementById(id);

    function showMessage(text, type = 'error') {
        const message = $('message');

        message.textContent = text;
        message.className = 'message ' + type;
    }

    function clearMessage() {
        $('message').textContent = '';
        $('message').className = 'message';
    }

    $('togglePassword').addEventListener('click', () => {
        const input = $('password');

        const isHidden = input.type === 'password';

        input.type = isHidden ? 'text' : 'password';

        $('togglePassword').textContent =
            isHidden ? 'Ẩn' : 'Hiện';
    });

    function clearAuth() {
        sessionStorage.removeItem(AUTH_KEYS.token);
        sessionStorage.removeItem(AUTH_KEYS.type);
        sessionStorage.removeItem(AUTH_KEYS.expiresAt);
    }

    function getRedirectPage() {
        const params = new URLSearchParams(
            window.location.search
        );

        const requestedPage = params.get('next');

        const allowedPages = [
            'classes.html',
            'students.html',
            'departments.html',
            'academic-years.html',
            'documents.html'
        ];

        return allowedPages.includes(requestedPage)
            ? requestedPage
            : 'classes.html';
    }

    $('loginForm').addEventListener(
        'submit',
        async event => {
            event.preventDefault();
            clearMessage();

            const username = $('username').value.trim();
            const password = $('password').value;

            if (!username || !password.trim()) {
                showMessage(
                    'Vui lòng nhập tên đăng nhập và mật khẩu'
                );
                return;
            }

            const button = $('loginBtn');

            button.disabled = true;
            button.textContent = 'Đang đăng nhập...';

            try {
                const response = await fetch(LOGIN_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    if (
                        response.status === 400 ||
                        response.status === 401
                    ) {
                        throw new Error(
                            'Tên đăng nhập hoặc mật khẩu không đúng'
                        );
                    }

                    if (response.status === 403) {
                        throw new Error(
                            'Tài khoản không được phép đăng nhập'
                        );
                    }

                    throw new Error(
                        'Đăng nhập thất bại (HTTP '
                        + response.status + ')'
                    );
                }

                const payload = await response.json();

                if (
                    !payload ||
                    payload.code !== 'SUCCESS' ||
                    !payload.data
                ) {
                    throw new Error(
                        'Phản hồi đăng nhập từ máy chủ không hợp lệ'
                    );
                }

                const data = payload.data;

                if (
                    !data.accessToken ||
                    typeof data.accessToken !== 'string'
                ) {
                    throw new Error(
                        'Máy chủ không trả về Access Token hợp lệ'
                    );
                }

                const tokenType = data.tokenType || 'Bearer';

                if (tokenType.toLowerCase() !== 'bearer') {
                    throw new Error(
                        'Loại token không được hỗ trợ'
                    );
                }

                const expiresIn = Number(data.expiresIn);

                if (
                    !Number.isFinite(expiresIn) ||
                    expiresIn <= 0
                ) {
                    throw new Error(
                        'Thời hạn token không hợp lệ'
                    );
                }

                clearAuth();

                sessionStorage.setItem(
                    AUTH_KEYS.token,
                    data.accessToken
                );

                sessionStorage.setItem(
                    AUTH_KEYS.type,
                    'Bearer'
                );

                sessionStorage.setItem(
                    AUTH_KEYS.expiresAt,
                    String(Date.now() + expiresIn * 1000)
                );

                showMessage(
                    'Đăng nhập thành công!',
                    'success'
                );

                window.location.replace(
                    getRedirectPage()
                );

            } catch (error) {
                clearAuth();

                showMessage(
                    error.message || 'Không thể đăng nhập'
                );

            } finally {
                button.disabled = false;
                button.textContent = 'Đăng nhập';
            }
        }
    );
</script>

</body>
</html>
