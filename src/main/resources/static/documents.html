<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài liệu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background: #e5e5e5;
            font-family: system-ui, sans-serif;
            color: #1f2937;
        }

        aside {
            width: 230px;
            flex-shrink: 0;
            background: #fff;
            padding: 16px;
        }

        aside h1 {
            margin: 0;
            font-size: 15px;
            color: #14397d;
        }

        aside small {
            color: #6b7280;
        }

        aside nav a {
            display: block;
            margin-top: 6px;
            padding: 10px 12px;
            border-radius: 6px;
            color: #374151;
            text-decoration: none;
            font-size: 14px;
        }

        aside nav a.active {
            background: #e8eefb;
            font-weight: 600;
        }

        main {
            flex: 1;
            min-width: 0;
            padding: 24px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        h2 {
            margin: 0;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .bar {
            display: flex;
            gap: 12px;
        }

        .bar input {
            flex: 1;
            min-width: 0;
        }

        input, textarea {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #14397d;
            background: #fff;
            color: #14397d;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
        }

        button.primary {
            background: #14397d;
            color: #fff;
        }

        button.primary:hover:not(:disabled) {
            background: #102e66;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 12px;
            background: #14397d;
            color: #fff;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .num {
            width: 60px;
            text-align: center;
        }

        .act {
            width: 150px;
            white-space: nowrap;
        }

        .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            color: #6b7280;
            font-size: 14px;
        }

        .pager {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pager button {
            padding: 6px 12px;
        }

        .pager button.cur {
            background: #14397d;
            color: #fff;
        }

        .msg {
            padding: 24px;
            text-align: center;
            color: #6b7280;
        }

        .notice {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #e8eefb;
            color: #14397d;
            font-size: 14px;
        }

        .notice.error {
            background: #fee2e2;
            color: #991b1b;
        }

        dialog {
            border: none;
            border-radius: 12px;
            padding: 24px;
            width: min(440px, 95vw);
            max-height: 90vh;
            overflow-y: auto;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
        }

        dialog h3 {
            margin: 0 0 16px;
        }

        dialog label {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
        }

        dialog input {
            display: block;
            width: 100%;
            margin-top: 4px;
        }

        .hint {
            margin: 0 0 12px;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.5;
        }

        .err {
            min-height: 20px;
            margin: 0 0 8px;
            color: #b91c1c;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media (max-width: 720px) {
            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
            }

            main {
                padding: 12px;
            }

            .head, .bar, .foot {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<aside>
    <h1>QUẢN LÝ MÔN HỌC</h1>
    <small>HỆ THỐNG QUẢN TRỊ</small>
    <nav id="nav"></nav>
</aside>

<main>

    <div class="head">
        <h2>Quản lý tài liệu</h2>

        <button class="primary" id="addBtn">
            + Thêm tài liệu
        </button>
    </div>

    <div id="notice"
         class="notice"
         role="status"
         aria-live="polite"></div>

    <div class="card bar">
        <input
                id="keyword"
                placeholder="Tìm theo tên tài liệu hoặc mã hồ sơ..."
                aria-label="Tìm kiếm tài liệu">

        <button id="searchBtn">
            Tìm kiếm
        </button>

        <button id="resetBtn">
            Làm mới
        </button>
    </div>

    <div class="card">

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th class="num">STT</th>
                    <th>Tên tài liệu</th>
                    <th>Mã hồ sơ</th>
                    <th>Phiên bản</th>
                    <th>Ngày tạo</th>
                    <th class="act">Thao tác</th>
                </tr>
                </thead>

                <tbody id="rows"></tbody>
            </table>
        </div>

        <div class="foot">
            <span id="info"></span>
            <div class="pager" id="pager"></div>
        </div>
    </div>

</main>

<dialog id="dlg">

    <form id="frm">

        <h3>Thêm tài liệu mới</h3>

        <label>
            Mã hồ sơ

            <input
                    id="fAppId"
                    maxlength="100"
                    required>
        </label>

        <label>
            Chọn tài liệu

            <input
                    id="fFiles"
                    type="file"
                    multiple
                    required
                    accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg">
        </label>

        <p class="hint">
            Định dạng hỗ trợ: PDF, Word, Excel, JPG, JPEG.
            Tối đa 10 MB cho mỗi tệp và 50 MB cho
            tổng dung lượng tải lên.
        </p>

        <p id="fErr" class="err" role="alert"></p>

        <div class="actions">
            <button type="button" id="cancelBtn">
                Hủy
            </button>

            <button type="submit"
                    class="primary"
                    id="saveBtn">
                Tải lên
            </button>
        </div>

    </form>

</dialog>

<script src="menu.js"></script>
<script src="role-ui.js"></script>
<script>
    const BASE = '/api/documents';
    const SIZE = 8;

    const AUTH_KEYS = {
        token: 'qlsv_access_token',
        type: 'qlsv_token_type',
        expiresAt: 'qlsv_expires_at'
    };

    const state = {
        keyword: '',
        page: 0
    };

    let documents = [];
    let filtered = [];

    const $ = id => document.getElementById(id);

    function clearAuth() {
        sessionStorage.removeItem(AUTH_KEYS.token);
        sessionStorage.removeItem(AUTH_KEYS.type);
        sessionStorage.removeItem(AUTH_KEYS.expiresAt);
    }

    function redirectToLogin() {
        window.location.replace(
            'login.html?next=documents.html'
        );
    }

    function getAccessToken() {
        const token = sessionStorage.getItem(
            AUTH_KEYS.token
        );

        const expiresAtText = sessionStorage.getItem(
            AUTH_KEYS.expiresAt
        );

        const expiresAt = Number(expiresAtText);

        if (
            !token ||
            !expiresAtText ||
            !Number.isFinite(expiresAt) ||
            expiresAt <= Date.now()
        ) {
            clearAuth();
            redirectToLogin();
            return null;
        }

        return token;
    }

    async function authorizedFetch(url, options = {}) {
        const token = getAccessToken();

        if (!token) {
            throw new Error(
                'Bạn chưa đăng nhập hoặc phiên đăng nhập đã hết hạn'
            );
        }

        const headers = new Headers(
            options.headers || {}
        );

        headers.set(
            'Authorization',
            'Bearer ' + token
        );

        const response = await fetch(url, {
            ...options,
            headers
        });

        if (response.status === 401) {
            clearAuth();
            redirectToLogin();

            throw new Error(
                'Phiên đăng nhập không hợp lệ hoặc đã hết hạn'
            );
        }

        return response;
    }

    function el(tag, text, cls) {
        const element = document.createElement(tag);

        if (text !== undefined && text !== null) {
            element.textContent = String(text);
        }

        if (cls) {
            element.className = cls;
        }

        return element;
    }

    function showNotice(message, isError = false) {
        const notice = $('notice');

        notice.textContent = message;

        notice.className = isError
            ? 'notice error'
            : 'notice';

        notice.style.display = 'block';
    }

    function hideNotice() {
        const notice = $('notice');

        notice.textContent = '';
        notice.style.display = 'none';
    }

    async function errorText(response) {
        if (response.status === 400) {
            return 'Thông tin gửi lên không hợp lệ';
        }

        if (response.status === 403) {
            return 'Tài khoản không có quyền thực hiện thao tác này';
        }

        if (response.status === 404) {
            return 'Không tìm thấy tài liệu hoặc đường dẫn yêu cầu';
        }

        if (response.status === 409) {
            return 'Tài liệu đã tồn tại hoặc xảy ra xung đột dữ liệu';
        }

        if (response.status === 413) {
            return 'Dung lượng tải lên vượt quá giới hạn máy chủ';
        }

        try {
            const data = await response.json();

            if (data && data.message) {
                return data.message;
            }

            if (data && data.detail) {
                return data.detail;
            }

        } catch (error) {
        }

        return 'Máy chủ trả về mã lỗi ' + response.status;
    }

    function messageRow(message) {
        const tr = el('tr');
        const td = el('td', message, 'msg');

        td.colSpan = 6;
        tr.append(td);

        return tr;
    }

    function formatDate(value) {
        if (!value) {
            return 'Chưa cập nhật';
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString('vi-VN');
    }

    async function load() {
        hideNotice();

        $('rows').replaceChildren(
            messageRow('Đang tải danh sách tài liệu...')
        );

        try {
            const response = await authorizedFetch(BASE);

            if (!response.ok) {
                throw new Error(
                    await errorText(response)
                );
            }

            const payload = await response.json();
            const data = payload.data;

            if (!Array.isArray(data)) {
                throw new Error(
                    'Dữ liệu danh sách tài liệu không hợp lệ'
                );
            }

            documents = data;

            filterDocuments();

            return true;

        } catch (error) {
            documents = [];
            filtered = [];

            $('rows').replaceChildren(
                messageRow(
                    'Không tải được dữ liệu: ' +
                    error.message
                )
            );

            $('info').textContent = '';
            $('pager').replaceChildren();

            showNotice(error.message, true);

            return false;
        }
    }

    function filterDocuments() {
        const keyword = state.keyword
            .trim()
            .toLocaleLowerCase('vi');

        filtered = documents.filter(documentItem => {
            const name = String(
                documentItem.name || ''
            ).toLocaleLowerCase('vi');

            const appId = String(
                documentItem.appId || ''
            ).toLocaleLowerCase('vi');

            return name.includes(keyword) ||
                appId.includes(keyword);
        });

        const pageCount = Math.max(
            1,
            Math.ceil(filtered.length / SIZE)
        );

        if (state.page >= pageCount) {
            state.page = pageCount - 1;
        }

        render();
    }

    function render() {
        const rows = $('rows');

        if (filtered.length === 0) {
            rows.replaceChildren(
                messageRow('Không tìm thấy tài liệu phù hợp')
            );

        } else {
            const start = state.page * SIZE;

            const items = filtered.slice(
                start,
                start + SIZE
            );

            const tableRows = items.map(
                (documentItem, index) => {

                    const tr = el('tr');

                    const actions = el(
                        'td',
                        undefined,
                        'act'
                    );

                    const downloadButton =
                        document.createElement('button');

                    downloadButton.type = 'button';
                    downloadButton.className = 'icon-btn';
                    downloadButton.title = 'Tải tài liệu xuống';

                    downloadButton.setAttribute(
                        'aria-label',
                        'Tải tài liệu xuống'
                    );

                    downloadButton.innerHTML = `
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M12 3v12"/>
                            <path d="m7 10 5 5 5-5"/>
                            <path d="M4 18v3h16v-3"/>
                        </svg>
                    `;

                    downloadButton.onclick = () =>
                        downloadFile(documentItem);

                    const deleteButton = iconButton(
                        'delete',
                        'Xóa tài liệu'
                    );

                    deleteButton.onclick = () =>
                        removeDocument(documentItem);

                    actions.append(
                        downloadButton,
                        deleteButton
                    );

                    tr.append(
                        el(
                            'td',
                            start + index + 1,
                            'num'
                        ),

                        el(
                            'td',
                            documentItem.name || ''
                        ),

                        el(
                            'td',
                            documentItem.appId || ''
                        ),

                        el(
                            'td',
                            documentItem.version ?? ''
                        ),

                        el(
                            'td',
                            formatDate(
                                documentItem.creationTime
                            )
                        ),

                        actions
                    );

                    return tr;
                }
            );

            rows.replaceChildren(...tableRows);
        }

        renderPager();
    }

    function renderPager() {
        const total = filtered.length;

        const totalPages = Math.max(
            1,
            Math.ceil(total / SIZE)
        );

        const from = total === 0
            ? 0
            : state.page * SIZE + 1;

        const to = Math.min(
            (state.page + 1) * SIZE,
            total
        );

        $('info').textContent = total === 0
            ? 'Không có tài liệu'
            : 'Hiển thị ' + from + ' - ' + to +
            ' trên tổng số ' + total + ' tài liệu';

        const previous = el('button', 'Trước');

        previous.disabled = state.page === 0;

        previous.onclick = () => {
            state.page--;
            render();
        };

        const buttons = [previous];

        for (
            let page = 0;
            page < totalPages;
            page++
        ) {
            const button = el(
                'button',
                page + 1,
                page === state.page ? 'cur' : ''
            );

            button.onclick = () => {
                state.page = page;
                render();
            };

            buttons.push(button);
        }

        const next = el('button', 'Sau');

        next.disabled =
            state.page >= totalPages - 1;

        next.onclick = () => {
            state.page++;
            render();
        };

        buttons.push(next);

        $('pager').replaceChildren(...buttons);
    }

    function search() {
        state.keyword = $('keyword').value.trim();
        state.page = 0;

        filterDocuments();
    }

    $('searchBtn').onclick = search;

    $('keyword').addEventListener(
        'keydown',
        event => {
            if (event.key === 'Enter') {
                event.preventDefault();
                search();
            }
        }
    );

    $('resetBtn').onclick = () => {
        $('keyword').value = '';

        state.keyword = '';
        state.page = 0;

        load();
    };

    function openForm() {
        $('frm').reset();
        $('fAppId').value = 'APP01';

        $('fErr').textContent = '';
        $('saveBtn').disabled = false;

        $('dlg').showModal();
    }

    $('addBtn').onclick = openForm;

    $('cancelBtn').onclick = () => {
        $('dlg').close();
    };

    function validateFiles(files) {
        const allowed = [
            'pdf',
            'doc',
            'docx',
            'xls',
            'xlsx',
            'jpg',
            'jpeg'
        ];

        let totalSize = 0;

        if (files.length === 0) {
            return 'Vui lòng chọn tài liệu cần tải lên';
        }

        for (const file of files) {
            const extension = file.name
                .split('.')
                .pop()
                .toLowerCase();

            if (!allowed.includes(extension)) {
                return 'Định dạng tệp không được hỗ trợ: ' +
                    file.name;
            }

            if (file.size === 0) {
                return 'Tệp không được để trống: ' +
                    file.name;
            }

            if (file.size > 10 * 1024 * 1024) {
                return 'Tệp vượt quá 10 MB: ' +
                    file.name;
            }

            totalSize += file.size;
        }

        if (totalSize > 50 * 1024 * 1024) {
            return 'Tổng dung lượng vượt quá 50 MB';
        }

        return null;
    }

    async function save(event) {
        event.preventDefault();

        const appId = $('fAppId').value.trim();

        const files = Array.from(
            $('fFiles').files
        );

        const validationError = validateFiles(files);

        if (!appId) {
            $('fErr').textContent =
                'Vui lòng nhập mã hồ sơ';

            return;
        }

        if (validationError) {
            $('fErr').textContent = validationError;
            return;
        }

        const formData = new FormData();

        formData.append('appId', appId);

        files.forEach(file => {
            formData.append('files', file);
        });

        $('fErr').textContent = '';
        $('saveBtn').disabled = true;

        try {
            const response = await authorizedFetch(
                BASE,
                {
                    method: 'POST',
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error(
                    await errorText(response)
                );
            }

            const savedPayload = await response.json();
            const saved = savedPayload.data;

            const count = Array.isArray(saved)
                ? saved.length
                : files.length;

            $('dlg').close();

            $('keyword').value = '';
            state.keyword = '';
            state.page = 0;

            const loaded = await load();

            if (loaded) {
                showNotice(
                    'Tải lên thành công ' +
                    count + ' tài liệu'
                );
            }

        } catch (error) {
            $('fErr').textContent =
                'Không thể tải tài liệu lên: ' +
                error.message;

        } finally {
            $('saveBtn').disabled = false;
        }
    }

    $('frm').onsubmit = save;

    async function downloadFile(documentItem) {
        try {
            if (!documentItem.path) {
                throw new Error(
                    'Tài liệu không có đường dẫn lưu trữ'
                );
            }

            const url =
                BASE +
                '/download?filePath=' +
                encodeURIComponent(documentItem.path);

            const response = await authorizedFetch(url);

            if (!response.ok) {
                throw new Error(
                    await errorText(response)
                );
            }

            const blob = await response.blob();

            const objectUrl = URL.createObjectURL(blob);

            const link = document.createElement('a');

            link.href = objectUrl;

            link.download = documentItem.name ||
                'tai-lieu';

            document.body.append(link);

            link.click();

            link.remove();

            setTimeout(() => {
                URL.revokeObjectURL(objectUrl);
            }, 60000);

            showNotice(
                'Đã gửi yêu cầu tải xuống tài liệu "' +
                (documentItem.name || 'Không có tên') +
                '"'
            );

        } catch (error) {
            showNotice(
                'Không thể tải tài liệu xuống: ' +
                error.message,
                true
            );
        }
    }

    async function removeDocument(documentItem) {
        const confirmed = confirm(
            'Bạn có chắc chắn muốn xóa tài liệu "' +
            documentItem.name +
            '" không?'
        );

        if (!confirmed) {
            return;
        }

        try {
            const response = await authorizedFetch(
                BASE + '/' +
                encodeURIComponent(documentItem.id),
                {
                    method: 'DELETE'
                }
            );

            if (!response.ok) {
                throw new Error(
                    await errorText(response)
                );
            }

            const loaded = await load();

            if (loaded) {
                showNotice(
                    'Xóa tài liệu thành công'
                );
            }

        } catch (error) {
            showNotice(
                'Không thể xóa tài liệu: ' +
                error.message,
                true
            );
        }
    }

    if (getAccessToken()) {
        load();
    }
</script>

</body>
</html>
