<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Quản lý sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background: #e5e5e5;
            font-family: system-ui, sans-serif;
            color: #1f2937;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        aside {
            width: 230px;
            flex-shrink: 0;
            background: #ffffff;
            padding: 16px;
        }

        aside h1 {
            margin: 0;
            font-size: 15px;
            color: #14397d;
        }

        aside small {
            color: #6b7280;
        }

        aside nav a {
            display: block;
            margin-top: 6px;
            padding: 10px 12px;
            border-radius: 6px;
            color: #374151;
            text-decoration: none;
            font-size: 14px;
        }

        aside nav a.active {
            background: #e8eefb;
            color: #14397d;
            font-weight: 600;
        }

        main {
            flex: 1;
            min-width: 0;
            padding: 24px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        h2 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 700;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar input {
            flex: 1;
            min-width: 0;
        }

        .bar select {
            min-width: 170px;
        }

        input,
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #ffffff;
            color: #1f2937;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #14397d;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #14397d;
            border-radius: 8px;
            background: #ffffff;
            color: #14397d;
            cursor: pointer;
        }

        button.primary {
            background: #14397d;
            color: #ffffff;
        }

        button:hover:not(:disabled) {
            background: #e8eefb;
        }

        button.primary:hover:not(:disabled) {
            background: #102e66;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 12px;
            background: #14397d;
            color: #ffffff;
            text-align: left;
            font-size: 14px;
            font-weight: 700;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .num {
            width: 60px;
            text-align: center;
        }

        .act {
            width: 115px;
            white-space: nowrap;
        }

        .msg {
            padding: 24px;
            text-align: center;
            color: #6b7280;
        }

        .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            color: #6b7280;
            font-size: 14px;
        }

        .pager {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pager button {
            padding: 6px 12px;
        }

        .pager button.cur {
            background: #14397d;
            color: #ffffff;
        }

        .notice {
            display: none;
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            background: #e8eefb;
            color: #14397d;
            font-size: 14px;
        }

        .notice.error {
            background: #fee2e2;
            color: #991b1b;
        }

        dialog {
            width: min(440px, 95vw);
            max-height: 90vh;
            overflow-y: auto;
            border: none;
            border-radius: 12px;
            padding: 24px;
            font-family: inherit;
            color: #1f2937;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
        }

        dialog h3 {
            margin: 0 0 16px;
            font-size: 19px;
        }

        dialog label {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
        }

        dialog input,
        dialog select {
            display: block;
            width: 100%;
            margin-top: 5px;
        }

        .err {
            min-height: 20px;
            margin: 0 0 8px;
            color: #b91c1c;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media (max-width: 720px) {
            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
            }

            main {
                padding: 12px;
            }

            .head,
            .bar,
            .foot {
                flex-wrap: wrap;
            }

            .bar input,
            .bar select {
                width: 100%;
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

<aside>
    <h1>QUẢN LÝ MÔN HỌC</h1>
    <small>HỆ THỐNG QUẢN TRỊ</small>
    <nav id="nav"></nav>
</aside>

<main>

    <div class="head">
        <h2>Quản lý sinh viên</h2>

        <button
                type="button"
                class="primary"
                id="addBtn">
            + Thêm sinh viên
        </button>
    </div>

    <div
            id="notice"
            class="notice"
            role="status"
            aria-live="polite">
    </div>

    <div class="card bar">

        <input
                id="keyword"
                placeholder="Tìm theo tên hoặc email..."
                aria-label="Từ khóa tìm kiếm sinh viên">

        <select
                id="deptFilter"
                aria-label="Lọc theo khoa">

            <option value="">
                Tất cả khoa
            </option>

        </select>

        <button
                type="button"
                id="searchBtn">
            Tìm kiếm
        </button>

        <button
                type="button"
                id="resetBtn">
            Làm mới
        </button>

    </div>

    <div class="card">

        <div class="table-wrap">

            <table>

                <thead>
                <tr>
                    <th class="num">
                        STT
                    </th>

                    <th
                            class="sortable"
                            data-sort="name">
                        Họ tên
                    </th>

                    <th
                            class="sortable"
                            data-sort="email">
                        Email
                    </th>

                    <th
                            class="sortable"
                            data-sort="dob">
                        Ngày sinh
                    </th>

                    <th>
                        Khoa
                    </th>

                    <th class="act">
                        Thao tác
                    </th>
                </tr>
                </thead>

                <tbody id="rows"></tbody>

            </table>

        </div>

        <div class="foot">

            <span id="info"></span>

            <div
                    class="pager"
                    id="pager">
            </div>

        </div>

    </div>

</main>

<dialog id="dlg">

    <form id="frm">

        <h3 id="dlgTitle"></h3>

        <label for="fName">
            Họ tên

            <input
                    id="fName"
                    maxlength="100"
                    required>
        </label>

        <label for="fEmail">
            Email

            <input
                    id="fEmail"
                    type="email"
                    maxlength="100"
                    required>
        </label>

        <label for="fDob">
            Ngày sinh

            <input
                    id="fDob"
                    type="date">
        </label>

        <label for="fDept">
            Khoa

            <select id="fDept" required>
                <option value="">
                    -- Chọn khoa --
                </option>
            </select>
        </label>

        <p
                id="fErr"
                class="err"
                role="alert">
        </p>

        <div class="actions">

            <button
                    type="button"
                    id="cancelBtn">
                Hủy
            </button>

            <button
                    type="submit"
                    class="primary"
                    id="saveBtn">
                Lưu
            </button>

        </div>

    </form>

</dialog>

<script src="menu.js"></script>

<script>
    const BASE = '/api/students';
    const DEPTS = '/api/departments';
    const SIZE = 8;

    const AUTH_KEYS = {
        token: 'qlsv_access_token',
        type: 'qlsv_token_type',
        expiresAt: 'qlsv_expires_at'
    };

    const LABELS = {
        name: 'Họ tên',
        email: 'Email',
        dob: 'Ngày sinh'
    };

    const state = {
        keyword: '',
        departmentId: '',
        page: 0,
        sortBy: 'id',
        direction: 'asc'
    };

    let editingId = null;

    const $ = id => document.getElementById(id);

    function clearAuth() {
        sessionStorage.removeItem(AUTH_KEYS.token);
        sessionStorage.removeItem(AUTH_KEYS.type);
        sessionStorage.removeItem(AUTH_KEYS.expiresAt);
    }

    function redirectToLogin() {
        window.location.replace(
            'login.html?next=students.html'
        );
    }

    function getAccessToken() {
        const token = sessionStorage.getItem(
            AUTH_KEYS.token
        );

        const expiresAtText = sessionStorage.getItem(
            AUTH_KEYS.expiresAt
        );

        const expiresAt = Number(expiresAtText);

        if (
            !token ||
            !expiresAtText ||
            !Number.isFinite(expiresAt) ||
            expiresAt <= Date.now()
        ) {
            clearAuth();
            redirectToLogin();
            return null;
        }

        return token;
    }

    async function authorizedFetch(url, options = {}) {
        const token = getAccessToken();

        if (!token) {
            throw new Error(
                'Bạn chưa đăng nhập hoặc phiên đăng nhập đã hết hạn'
            );
        }

        const headers = new Headers(
            options.headers || {}
        );

        headers.set(
            'Authorization',
            'Bearer ' + token
        );

        const response = await fetch(url, {
            ...options,
            headers
        });

        if (response.status === 401) {
            clearAuth();
            redirectToLogin();

            throw new Error(
                'Phiên đăng nhập đã hết hạn hoặc không hợp lệ'
            );
        }

        return response;
    }

    function el(tag, text, className) {
        const element = document.createElement(tag);

        if (text !== undefined && text !== null) {
            element.textContent = String(text);
        }

        if (className) {
            element.className = className;
        }

        return element;
    }

    function option(value, text) {
        const element = el('option', text);
        element.value = value;
        return element;
    }

    function showNotice(message, isError = false) {
        const notice = $('notice');

        notice.textContent = message;

        notice.className = isError
            ? 'notice error'
            : 'notice';

        notice.style.display = 'block';
    }

    function hideNotice() {
        const notice = $('notice');

        notice.textContent = '';
        notice.style.display = 'none';
    }

    function messageRow(message) {
        const tr = el('tr');
        const td = el('td', message, 'msg');

        td.colSpan = 6;
        tr.append(td);

        return tr;
    }

    async function errorText(response) {
        if (response.status === 403) {
            return 'Tài khoản không có quyền thực hiện thao tác này';
        }

        if (response.status === 404) {
            return 'Không tìm thấy dữ liệu hoặc đường dẫn API';
        }

        if (response.status === 409) {
            return 'Email đã tồn tại hoặc dữ liệu đang bị xung đột';
        }

        try {
            const data = await response.json();

            if (data && data.message) {
                return data.message;
            }
        } catch (error) {
        }

        if (response.status === 400) {
            return 'Thông tin sinh viên không hợp lệ';
        }

        return 'Máy chủ trả về mã lỗi ' + response.status;
    }

    async function loadDepartments() {
        try {
            const response = await authorizedFetch(DEPTS);

            if (!response.ok) {
                throw new Error(
                    await errorText(response)
                );
            }

            const payload = await response.json();
            const departments = payload.data;

            if (!Array.isArray(departments)) {
                throw new Error(
                    'Dữ liệu danh sách khoa không hợp lệ'
                );
            }

            const filterOptions = departments.map(
                department => option(
                    department.id,
                    department.name
                )
            );

            const formOptions = departments.map(
                department => option(
                    department.id,
                    department.name
                )
            );

            $('deptFilter').replaceChildren(
                option('', 'Tất cả khoa'),
                ...filterOptions
            );

            $('fDept').replaceChildren(
                option('', '-- Chọn khoa --'),
                ...formOptions
            );

        } catch (error) {
            showNotice(
                'Không tải được danh sách khoa: ' +
                error.message,
                true
            );
        }
    }

    async function load() {
        const params = new URLSearchParams({
            keyword: state.keyword,
            page: String(state.page),
            size: String(SIZE),
            sortBy: state.sortBy,
            direction: state.direction
        });

        if (state.departmentId !== '') {
            params.set(
                'departmentId',
                state.departmentId
            );
        }

        $('rows').replaceChildren(
            messageRow('Đang tải danh sách sinh viên...')
        );

        try {
            const response = await authorizedFetch(
                BASE + '/search?' + params.toString()
            );

            if (!response.ok) {
                throw new Error(
                    await errorText(response)
                );
            }

            const payload = await response.json();
            const data = payload.data;

            if (
                !data ||
                !Array.isArray(data.content) ||
                !Number.isInteger(data.page) ||
                !Number.isInteger(data.totalPages)
            ) {
                throw new Error(
                    'Dữ liệu danh sách sinh viên không hợp lệ'
                );
            }

            if (
                data.content.length === 0 &&
                data.page > 0
            ) {
                const lastPage = Math.max(
                    data.totalPages - 1,
                    0
                );

                if (state.page !== lastPage) {
                    state.page = lastPage;
                    return load();
                }
            }

            render(data);
            return true;

        } catch (error) {
            $('rows').replaceChildren(
                messageRow(
                    'Không tải được dữ liệu: ' +
                    error.message
                )
            );

            $('info').textContent = '';
            $('pager').replaceChildren();

            showNotice(error.message, true);
            return false;
        }
    }

    function render(data) {
        const rows = $('rows');

        if (data.content.length === 0) {
            rows.replaceChildren(
                messageRow('Không có dữ liệu sinh viên')
            );

        } else {
            const tableRows = data.content.map(
                (student, index) => {

                    const tr = el('tr');

                    const actionCell = el(
                        'td',
                        undefined,
                        'act'
                    );

                    const editButton = iconButton(
                        'edit',
                        'Sửa sinh viên'
                    );

                    editButton.onclick = () =>
                        openForm(student);

                    const deleteButton = iconButton(
                        'delete',
                        'Xóa sinh viên'
                    );

                    deleteButton.onclick = () =>
                        removeStudent(student);

                    actionCell.append(
                        editButton,
                        deleteButton
                    );

                    tr.append(
                        el(
                            'td',
                            data.page * data.size +
                            index + 1,
                            'num'
                        ),

                        el('td', student.name),

                        el('td', student.email),

                        el(
                            'td',
                            student.dob || ''
                        ),

                        el(
                            'td',
                            student.departmentName ||
                            'Chưa có khoa'
                        ),

                        actionCell
                    );

                    return tr;
                }
            );

            rows.replaceChildren(...tableRows);
        }

        $('info').textContent =
            'Hiển thị ' +
            data.content.length +
            ' trên tổng số ' +
            data.totalElements +
            ' sinh viên';

        renderPager(data);
        renderSortMarks();
    }

    function renderPager(data) {
        const previous = el(
            'button',
            'Trước'
        );

        previous.disabled = data.page === 0;

        previous.onclick = () => {
            state.page--;
            load();
        };

        const next = el(
            'button',
            'Sau'
        );

        next.disabled =
            data.page >= data.totalPages - 1;

        next.onclick = () => {
            state.page++;
            load();
        };

        const pageButtons = [];

        for (
            let page = 0;
            page < data.totalPages;
            page++
        ) {
            const button = el(
                'button',
                page + 1,
                page === data.page ? 'cur' : ''
            );

            button.onclick = () => {
                state.page = page;
                load();
            };

            pageButtons.push(button);
        }

        $('pager').replaceChildren(
            previous,
            ...pageButtons,
            next
        );
    }

    function renderSortMarks() {
        document.querySelectorAll(
            'th.sortable'
        ).forEach(th => {

            const field = th.dataset.sort;

            const mark =
                state.sortBy === field
                    ? (
                        state.direction === 'asc'
                            ? ' ▲'
                            : ' ▼'
                    )
                    : '';

            th.textContent =
                LABELS[field] + mark;
        });
    }

    document.querySelectorAll(
        'th.sortable'
    ).forEach(th => {

        th.onclick = () => {
            const field = th.dataset.sort;

            state.direction =
                state.sortBy === field &&
                state.direction === 'asc'
                    ? 'desc'
                    : 'asc';

            state.sortBy = field;
            state.page = 0;

            hideNotice();
            load();
        };
    });

    function doSearch() {
        state.keyword =
            $('keyword').value.trim();

        state.departmentId =
            $('deptFilter').value;

        state.page = 0;

        hideNotice();
        load();
    }

    $('searchBtn').onclick = doSearch;

    $('deptFilter').onchange = doSearch;

    $('keyword').onkeydown = event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            doSearch();
        }
    };

    $('resetBtn').onclick = () => {
        $('keyword').value = '';
        $('deptFilter').value = '';

        state.keyword = '';
        state.departmentId = '';
        state.page = 0;
        state.sortBy = 'id';
        state.direction = 'asc';

        hideNotice();
        load();
    };

    function openForm(student) {
        editingId = student
            ? student.id
            : null;

        $('dlgTitle').textContent = student
            ? 'Cập nhật thông tin sinh viên'
            : 'Thêm sinh viên mới';

        $('fName').value = student
            ? student.name
            : '';

        $('fEmail').value = student
            ? student.email
            : '';

        $('fDob').value =
            student && student.dob
                ? student.dob
                : '';

        $('fDept').value =
            student &&
            student.departmentId != null
                ? String(student.departmentId)
                : '';

        $('fErr').textContent = '';
        $('saveBtn').disabled = false;

        $('dlg').showModal();
    }

    $('addBtn').onclick = () =>
        openForm(null);

    $('cancelBtn').onclick = () =>
        $('dlg').close();

    $('frm').onsubmit = async event => {
        event.preventDefault();

        const name =
            $('fName').value.trim();

        const email =
            $('fEmail').value.trim();

        const departmentId =
            $('fDept').value;

        if (!name || !email || !departmentId) {
            $('fErr').textContent =
                'Vui lòng nhập họ tên, email và chọn khoa';

            return;
        }

        const body = {
            name,
            email,
            dob: $('fDob').value || null,
            departmentId: Number(departmentId)
        };

        const isEdit = editingId !== null;

        const url = isEdit
            ? BASE + '/' +
            encodeURIComponent(editingId)
            : BASE;

        $('fErr').textContent = '';
        $('saveBtn').disabled = true;

        try {
            const response = await authorizedFetch(
                url,
                {
                    method: isEdit ? 'PUT' : 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(body)
                }
            );

            if (!response.ok) {
                $('fErr').textContent =
                    await errorText(response);

                return;
            }

            $('dlg').close();

            const loaded = await load();

            if (loaded) {
                showNotice(
                    isEdit
                        ? 'Cập nhật sinh viên thành công'
                        : 'Thêm sinh viên thành công'
                );
            }

        } catch (error) {
            $('fErr').textContent =
                'Không thể lưu sinh viên: ' +
                error.message;

        } finally {
            $('saveBtn').disabled = false;
        }
    };

    async function removeStudent(student) {
        const confirmed = confirm(
            'Bạn có chắc chắn muốn xóa sinh viên "' +
            student.name +
            '" không?'
        );

        if (!confirmed) {
            return;
        }

        try {
            const response = await authorizedFetch(
                BASE + '/' +
                encodeURIComponent(student.id),
                {
                    method: 'DELETE'
                }
            );

            if (!response.ok) {
                showNotice(
                    await errorText(response),
                    true
                );

                return;
            }

            const loaded = await load();

            if (loaded) {
                showNotice(
                    'Xóa sinh viên thành công'
                );
            }

        } catch (error) {
            showNotice(
                'Không thể xóa sinh viên: ' +
                error.message,
                true
            );
        }
    }

    async function initialize() {
        if (!getAccessToken()) {
            return;
        }

        await loadDepartments();
        await load();
    }

    initialize();
</script>

</body>
</html>
